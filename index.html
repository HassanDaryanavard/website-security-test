<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>هشدار امنیتی - وب‌سایت دستکاری شده</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: Tahoma, sans-serif;
      text-align: center;
    }

    .warning {
      max-width: 700px;
      margin: 100px auto;
      padding: 40px;
      border: 2px solid #cc0000;
      border-radius: 10px;
      background: #1a1a1a;
    }

    h1 {
      color: #ff3333;
      font-size: 36px;
    }

    .message {
      margin-top: 30px;
      font-size: 20px;
      line-height: 2;
    }

    .signature {
      margin-top: 40px;
      color: #ff6666;
      font-family: monospace;
    }
  </style>
</head>

<body>

  <div class="warning">

    <h1>Security Warning</h1>

    <div class="message">
      <p>این صفحه به صورت آزمایشی تغییر داده شده است.</p>

      <p>
        Website has been defaced
      </p>

      <p>
        محتوای اصلی وب‌سایت در دسترس نیست.
      </p>
    </div>

    <div class="signature">
      TEST SECURITY INCIDENT
    </div>

  </div>

</body>
</html>
