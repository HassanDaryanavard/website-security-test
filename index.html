<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پورتال اطلاع‌رسانی دانشگاه علم و فناوری</title>

  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #f1f5f9;
      --text: #334155;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, "Segoe UI", sans-serif;
    }

    body {
      background-color: var(--secondary);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: var(--primary);
      color: var(--white);
      padding: 2rem;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 3rem auto;
      padding: 2rem;
      background-color: var(--white);
      border-radius: 8px;
      text-align: center;
    }

    h1 {
      margin-bottom: 1rem;
    }

    p {
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .links a {
      text-decoration: none;
      background-color: var(--primary);
      color: var(--white);
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding: 1rem;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>دانشگاه علم و فناوری</h1>
  </header>

  <main>

    <h2>اطلاعیه</h2>

    <p>
      درگاه اطلاع‌رسانی دانشگاه در حال بروزرسانی است.
    </p>

    <p>
      جهت دریافت اطلاعات بیشتر از بخش‌های اصلی سامانه استفاده نمایید.
    </p>

    <div class="links">

      <a href="/index.html">
        صفحه اصلی
      </a>

      <a href="/contact">
        تماس با ما
      </a>

    </div>

  </main>

  <footer>
    <p>
      تمامی حقوق مادی و معنوی متعلق به دانشگاه علم و فناوری می‌باشد © ۱۴۰۵
    </p>
  </footer>

</body>
</html>
