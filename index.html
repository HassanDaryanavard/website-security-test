<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hacked Portal - University of Science and Technology</title>

  <style>
    :root {
      --primary: #111111;
      --secondary: #1f2937;
      --text: #f8fafc;
      --accent: #dc2626;
      --white: #ffffff;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, "Segoe UI", sans-serif;
    }

    body {
      background-color: var(--secondary);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background-color: var(--primary);
      color: var(--white);
      padding: 3rem 2rem;
      border-bottom: 5px solid var(--accent);
      text-align: center;
    }

    .warning {
      max-width: 900px;
      margin: 3rem auto;
      background: #111827;
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
    }

    .warning h1 {
      color: #ef4444;
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .warning p {
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .warning a {
      display: inline-block;
      margin-top: 1.5rem;
      text-decoration: none;
      color: var(--white);
      background: #2563eb;
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
    }

    .links {
      max-width: 700px;
      margin: 2rem auto;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      background: #334155;
      color: var(--white);
      padding: 0.75rem 1rem;
      border-radius: 4px;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding: 1rem;
      color: #cbd5e1;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>دانشگاه علم و فناوری</h1>
    <p>درگاه اطلاع‌رسانی دانشگاه</p>
  </header>

  <main>

    <section class="warning">

      <h1>Hacked By Sepehr Test</h1>

      <p>
        این صفحه برای آزمایش سامانه پایش امنیتی سپهر تغییر داده شده است.
      </p>

      <p>
        Website security test page.
      </p>

      <a href="https://t.me/sepehr-test">
        Contact
      </a>

    </section>

    <div class="links">

      <a href="/index.html">
        صفحه اصلی
      </a>

      <a href="/contact">
        تماس با ما
      </a>

      <a href="/systems/mail">
        پست الکترونیک
      </a>

    </div>

  </main>

  <footer>
    <p>
      دانشگاه علم و فناوری © ۱۴۰۵
    </p>
  </footer>

</body>
</html>
